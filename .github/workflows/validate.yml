name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate the skill
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate the frontmatter
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib

          path = pathlib.Path('skills/test-driven-development/SKILL.md')
          text = path.read_text(encoding='utf-8')

          if not text.startswith('---'):
              sys.exit('SKILL.md does not start with a frontmatter block.')

          block = text.split('---')[1]
          data = yaml.safe_load(block)

          errors = []

          name = data.get('name', '')
          if not name:
              errors.append('The name field is empty.')
          if len(name) > 64:
              errors.append(f'The name field is {len(name)} characters. The limit is 64.')
          if not all(c.islower() or c.isdigit() or c == '-' for c in name):
              errors.append('The name field must contain only lowercase letters, numbers, and hyphens.')

          description = data.get('description', '')
          if not description:
              errors.append('The description field is empty.')
          if len(description) > 1024:
              errors.append(f'The description field is {len(description)} characters. The limit is 1024.')

          if errors:
              sys.exit('\n'.join(errors))

          print(f'The frontmatter is valid. name={name}')
          PY

      - name: Check the length of the skill body
        run: |
          lines=$(wc -l < skills/test-driven-development/SKILL.md)
          echo "SKILL.md has $lines lines."
          if [ "$lines" -gt 500 ]; then
            echo "SKILL.md is longer than 500 lines. Move detail into references/."
            exit 1
          fi

      - name: Check that the bundled files exist
        run: |
          test -f skills/test-driven-development/references/evidence.md
          test -f skills/test-driven-development/assets/logo.png
          test -f assets/logo.png
          test -f assets/logo-256.png
          test -f LICENSE
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          echo "The bundled files are present."

      - name: Check that the internal links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          missing = []
          for source in pathlib.Path('.').rglob('*.md'):
              if '.git' in source.parts:
                  continue
              text = source.read_text(encoding='utf-8')
              for match in re.finditer(r'\]\((?!https?://|mailto:|#)([^)]+)\)', text):
                  target = match.group(1).split('#')[0]
                  if not target:
                      continue
                  if not (source.parent / target).exists():
                      missing.append(f'{source}: {target}')

          if missing:
              sys.exit('These internal links do not resolve:\n' + '\n'.join(missing))
          print('The internal links resolve.')
          PY

      - name: Check that the README images resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          readme = pathlib.Path('README.md')
          text = readme.read_text(encoding='utf-8')
          missing = []

          for match in re.finditer(r'<img[^>]*src="([^"]+)"', text):
              target = match.group(1)
              if target.startswith(('http://', 'https://')):
                  continue
              if not (readme.parent / target).exists():
                  missing.append(target)

          if missing:
              sys.exit('The README refers to images that do not exist: ' + ', '.join(missing))
          print('The README images resolve.')
          PY

      - name: Check that the README badges resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, urllib.request, urllib.error

          text = pathlib.Path('README.md').read_text(encoding='utf-8')
          urls = sorted(set(re.findall(r'!\[[^\]]*\]\((https://img\.shields\.io/[^)]+)\)', text)))

          if not urls:
              sys.exit('No shields.io badges found in the README.')

          failed = []
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'ci-check'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode('utf-8', 'replace')
              except urllib.error.URLError as error:
                  failed.append(f'{url} failed: {error}')
                  continue

              if response.status != 200:
                  failed.append(f'{url} returned {response.status}')
                  continue
              if '<svg' not in body:
                  failed.append(f'{url} did not return an SVG')
                  continue

              # shields.io answers a malformed request with HTTP 200 and an error
              # badge, so the status code alone cannot detect a broken badge. The
              # aria-label carries the rendered text.
              label = re.search(r'aria-label="([^"]*)"', body)
              label_text = label.group(1).lower() if label else ''
              for bad in ('404', 'not found', 'invalid', 'inaccessible', 'error'):
                  if bad in label_text:
                      failed.append(f'{url} rendered an error badge: {label.group(1)}')
                      break

          if failed:
              sys.exit('These badges do not resolve:\n' + '\n'.join(failed))
          print(f'All {len(urls)} badges resolve.')
          PY

      - name: Check the typography
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          banned = {'\u2014': 'em dash', '\u2013': 'en dash'}
          emoji = re.compile('[\U0001F300-\U0001FAFF\u2600-\u27BF]')
          found = False

          for path in sorted(pathlib.Path('.').rglob('*.md')):
              if '.git' in path.parts:
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              for number, line in enumerate(lines, 1):
                  for character, label in banned.items():
                      if character in line:
                          print(f'{path}:{number}: found {label}')
                          found = True
                  if emoji.search(line):
                      print(f'{path}:{number}: found emoji')
                      found = True

          if found:
              sys.exit('The style standard prohibits these characters.')
          print('The typography is correct.')
          PY
